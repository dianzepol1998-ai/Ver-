<!doctype html>
<html lang="en">
  <head>
    <title>Remix Maps Styling</title>
    <meta charset="utf-8" />
    <meta name="description" content="Give your Google Map a new personality to match your brand, your mood, or the spirit of your favorite holiday" />
    <meta property="og:title" content="Remix Maps Styling" />
    <meta property="og:description" content="Give your Google Map a new personality to match your brand, your mood, or the spirit of your favorite holiday" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Google+Sans+Text" />
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@1.30.0",
          "@modelcontextprotocol/sdk/": "https://esm.sh/@modelcontextprotocol/sdk@1.22.0/dist/esm/",
          "zod": "https://esm.sh/zod@3.25.76",
          "highlight.js": "https://esm.sh/highlight.js@11.11.1",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "marked": "https://esm.sh/marked@15.0.12",
          "marked-highlight": "https://esm.sh/marked-highlight@2.2.3",
          "google3/": "https://esm.sh/google3@^1.0.0/",
          "typed.js": "https://esm.sh/typed.js@2.1.0"
        }
      }
    </script>
    <script>
      // Ensure WebGL drawing buffer is preserved for map view snapshots
      (function() {
        const origGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attributes) {
          if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
            attributes = Object.assign({}, attributes, { preserveDrawingBuffer: true });
          }
          return origGetContext.call(this, type, attributes);
        };
      })();
    </script>
    <script
      src="https://maps.googleapis.com/maps/api/js?libraries=places&key=AIzaSyBdf3qEHerho4yhseDl3vf-06ZHUcub-rI&v=weekly"
      defer
    ></script>
  <link rel="stylesheet" href="/index.css">
</head>

</body>
